name: Production CI/CD & Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Build & Test Java Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit & Integration Tests
        run: |
          cd Java-Login-App
          mvn clean test

      - name: Package Application War
        run: |
          cd Java-Login-App
          mvn package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-package
          path: Java-Login-App/target/*.war

  docker-build-and-scan:
    name: Docker Build & Vulnerability Scan
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Java-Login-App
          file: ./Java-Login-App/Dockerfile
          load: true
          tags: grizzlyops-app:latest

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-java-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  terraform-lint-and-validate:
    name: Terraform Quality & Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        continue-on-error: true
        run: |
          cd infrastructure
          terraform fmt -check -diff

      - name: Terraform Init & Validate
        run: |
          cd infrastructure
          terraform init -backend=false
          terraform validate
